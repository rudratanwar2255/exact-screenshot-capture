<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="40%" stop-color="#fba4b8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d0614" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="50%" stop-color="#fecfef" />
      <stop offset="100%" stop-color="#f0b5a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="#1b0d26" />
  <circle cx="50" cy="50" r="45" stroke="#fba4b8" stroke-width="2" stroke-opacity="0.6" fill="none" />

  <!-- Romantic Heart -->
  <path d="M50 82 C50 82 18 58 18 36 C18 22 29 16 39 16 C46 16 50 22 50 22 C50 22 54 16 61 16 C71 16 82 22 82 36 C82 58 50 82 50 82 Z"
        fill="url(#heartGrad)"
        filter="url(#glow)" />

  <!-- Little Sparkle -->
  <path d="M72 18 Q72 26 80 26 Q72 26 72 34 Q72 26 64 26 Q72 26 72 18 Z"
        fill="#ffffff"
        filter="url(#glow)" />
  <circle cx="72" cy="26" r="1.5" fill="#fff" />
</svg>
